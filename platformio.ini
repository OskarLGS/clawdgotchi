[platformio]
default_envs = ultra

; Versiones fijadas: el presupuesto de heap del TLS (ver AGENTS.md) depende
; del core y de las librerias; una actualizacion silenciosa puede romperlo.
; Subirlas a proposito y verificar en el cubo.
[env:ultra]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINOJSON_USE_DOUBLE=0
    -D USER_SETUP_LOADED
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT7
    -D LOAD_GFXFF
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_SCLK=14
    -D TFT_MOSI=13
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_CS=15
    -D SPI_FREQUENCY=40000000
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    bodmer/TFT_eSPI @ 2.5.43

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_deps = bblanchon/ArduinoJson @ 7.4.2
