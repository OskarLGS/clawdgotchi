name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # Tests nativos primero: `pio test -e native` borra .pio/build/ultra/.
      - name: Tests nativos
        run: pio test -e native
      # Sin credenciales WiFi: comprueba que compila y que no hace falta ninguna.
      - name: Compilar firmware (ultra)
        run: pio run -e ultra
      - name: Tamaño del firmware
        run: ls -l .pio/build/ultra/firmware.bin
